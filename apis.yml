aid: veritiv
name: Veritiv
description: |-
  Veritiv is a North American business-to-business distributor of packaging, facility
  solutions, print, and publishing products. Formed in July 2014 through the merger of
  International Paper's xpedx division with Unisource Worldwide, Veritiv operated as a
  publicly traded company on the New York Stock Exchange until it was acquired and
  taken private by Clayton, Dubilier & Rice (CD&R) in November 2023 in a transaction
  valued at approximately $2.3 billion. The company is headquartered in Sandy Springs,
  Georgia, and operates roughly 125 distribution centers across the United States and
  Mexico. Veritiv does not publish any public developer APIs, OpenAPI specifications,
  SDKs, or a developer portal — its commercial surface is built around sales reps,
  account managers, and large-account customer portals rather than a programmable API.
